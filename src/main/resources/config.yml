#Префикс перед каждым сообщением
prefix: "&8[&6StrictMC&8] &r"

#Настройка уведомлений, при получении валюты или в том случае если её забрали
notify:
  #Получение валюты(От консоли/админа)
  target-on-give: true
  #Консоль/админ забрали валюту
  target-on-take: true
  #Консоль/админ установили количество рубинов
  target-on-set: true

#Сообщения плагина
message:
  #Нет прав на использование какой-либо из команд :-)
  no-permission: "&cУ вас нет прав!"
  not-message-config: |
    &cСообщение не найдено в конфиге, 
    &cпожалуйста проверьте целостность конфига.
    &cВозможно была удалена строчка.
    &cНе хватает: &6
  player-not-found: "&cИгрок %player% не найден!"
  invalid-number: "&cСумма должна быть числом."
  invalid-amount: "&cСумма должна быть положительной."
  not-rubins: "&cУ вас недостаточно рубинов."
  i-dont-player: "&cЭту команду может использовать только игрок."
  console-not-player: "&aКонсоль должна указать игрока: /rubin balance <игрок>"
  balance: "&aУ игрока %player% сейчас &6%amount% &aрубинов."
  low-args-to-pay: "&cИспользование: /rubin pay <игрок> <сумма>"
  pay-success: "&aВы перевели %amount% рубинов игроку %target%."
  pay-received: "&aИгрок %sender% перевёл вам %amount% рубинов."
  pay-error: "&cНе удалось выполнить перевод, попробуйте позже."
  low-args-to-give: "&cИспользование: /rubin give <игрок> <сумма>"
  give-success: "&aВыдано %amount% рубинов игроку %target%"
  give-received: "&aВам выдано %amount% рубинов."
  give-error: "&cНе удалось выдать рубины."
  low-args-to-take: "&cИспользование: /rubin take <игрок> <сумма>"
  take-rubin-malo: "&cУ игрока %player% недостаточно рубинов."
  take-success: "&aЗабрано %amount% рубинов у игрока %target%."
  take-taken: "&cУ вас забрали %amount% рубинов."
  set-success: "&aВы установили %amount% рубинов игроку %target%"
  set-seter: "&aВам установили %amount% рубинов"
  set-error: "&cНе удалось установить рубины."
  reload-success: "&aКонфигурация успешно перезагружена!"
  take-error: "&cНе удалось забрать рубины."
  help-header: "&7=== Помощь по рубинам ===="
  help-balance: "&e/rubin balance <игрок> &f- Проверить баланс"
  help-pay: "&e/rubin pay <игрок> <Сумма> &f- Перевести рубины другу"
  #Для получения доступа к админ командам нужно выдать право strict.rubin.admin
  help-give: "&e/rubin give <игрок> <Сумма> &f- Выдать рубины(админка)"
  #Для получения доступа к админ командам нужно выдать право strict.rubin.admin
  help-take: "&e/rubin take <игрок> <Сумма> &f- Забрать рубины(админка)"
  #Для получения доступа к админ командам нужно выдать право strict.rubin.admin
  help-set: "&e/rubin set <игрок> <Сумма> &f- Установить рубины игроку(админка)"
  #Для получения доступа к админ командам нужно выдать право strict.rubin.admin
  help-reload: "&e/rubin reload &f- Перезагрузить конфиг(админка)"

permissions:
  #Права для админа, на команды:
  #/<команда> give;
  #/<команда> take;
  #/<команда> set;
  #/<команда> reload
  admin-perms: "rubin.admin"

#Команда/команды которые регистрирует плагин, то есть можете настроить всё по своему вкусу
#Например coins, rubli, арбузы, помидоры, пряники, diamonds и так далее и тому подобное
commands:
  - rubin
  - rub
  - strict